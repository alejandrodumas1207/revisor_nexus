[project]
name = "revisor-nexus"
version = "0.1.0"
description = "Descarga, revisión asistida y carga de calificaciones en NEXUS UANL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "keyring>=25",
    "playwright>=1.56",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos y signos del español

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/revisor/dominio", "src/revisor/servicios"]
venvPath = "."
venv = ".venv"
